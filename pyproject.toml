[build-system]
requires = ["setuptools~=82.0.1"]
build-backend = "setuptools.build_meta"
[project]
name = "okta-looker-scim-bridge"
version = "0.1.0"
description = "Middleware which translates SCIM requests from Okta to Looker API calls"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "gunicorn~=25.3",
    "Flask~=3.1",
    "looker-sdk~=26.6",
    "beautifulsoup4~=4.14",
    "google-api-core~=2.30",
    "google-auth~=2.49",
    "google-cloud-datastore~=2.24",
    "google-cloud-firestore~=2.27",
    "google-cloud-secret-manager~=2.27",
    "google-cloud-logging~=3.15",
    "scim2-models~=0.6"
]
[project.optional-dependencies]
lint = [
    "ruff~=0.15",
    "flake8~=7.3",
    "flake8-github-annotations~=1.1",
    "isort~=6.0",
    "pylint~=3.0",
    "pylint-actions~=0.6" #this currently blocks pylint from going above v3 which in turn blocks isort from going above v6
]
dev = [
    "okta-looker-scim-bridge[lint]",
    "pip-tools",
    "pytest-mock"
]
[project.urls]
repository = "https://github.com/epidemicsound/okta-looker-scimbridge-pub"
[tool.setuptools]
packages = ["app"]
[tool.coverage.report]
exclude_lines = [
    "@abc.abstractmethod",
]
